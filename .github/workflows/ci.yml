name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Checks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: shellcheck .github/scripts/admit-stage .github/scripts/admit-stage.test.sh
      - run: bash .github/scripts/admit-stage.test.sh
