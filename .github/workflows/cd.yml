name: CD

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    outputs:
      accepted:
        value: ${{ jobs.oci_image_packaging.outputs.accepted }}

permissions:
  contents: read
  deployments: write

jobs:
  oci_image_packaging:
    name: OCI Image Packaging
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: pipeline-stage-oci-image-packaging
      queue: max
      cancel-in-progress: false
    outputs:
      accepted: ${{ steps.admission.outputs.accepted }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: .pipeline
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: ./.pipeline/.github/scripts/admit-stage oci-image-packaging
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.admission.outputs.accepted == 'true'
        with:
          name: release-artifact-${{ inputs.source_sha }}
      - run: tar -xzf release-artifact.tar.gz
        if: steps.admission.outputs.accepted == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.admission.outputs.accepted == 'true'
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - run: mkdir -p build
        if: steps.admission.outputs.accepted == 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.admission.outputs.accepted == 'true'
        with:
          context: .
          platforms: linux/arm64
          tags: template-pure-java:latest
          outputs: type=oci,dest=build/oci-image.tar
          provenance: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.admission.outputs.accepted == 'true'
        with:
          name: oci-image-${{ inputs.source_sha }}
          path: build/oci-image.tar
          if-no-files-found: error
          overwrite: true
