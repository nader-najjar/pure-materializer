name: "Materialize"
run-name: "Materialize"
"on":
  push:
    branches:
    - "execution"
concurrency:
  group: "materialize"
  queue: "single"
  cancel-in-progress: false
permissions:
  contents: "read"
jobs:
  step_1:
    name: "Continuous Integration - Build ${{ matrix.repositoryName }} (${{ matrix.platform }})"
    env:
      CLIENT_ID_VARIABLE: "PURE_APP_CLIENT_ID"
      PRIVATE_KEY_SECRET: "PURE_APP_PRIVATE_KEY"
    strategy:
      fail-fast: false
      matrix:
        include:
        - repositoryName: "nader-najjar/pure-java"
          commitSHA: "6f0e53a80486a7bca8caf647afe0087f8f34e299"
          buildSystem: "universal"
          platform: "aarch64-linux"
          runner: "ubuntu-24.04-arm"
    runs-on: "${{ matrix.runner }}"
    steps:
    - name: "Reject Manual Retries"
      uses: "$/.github/actions/reject-manual-retries"
    - name: "Reject Unsupported Build Systems"
      if: "matrix.buildSystem != 'universal'"
      run: "echo \"::error::Unsupported build system: $BUILD_SYSTEM\"; exit 1"
      env:
        BUILD_SYSTEM: "${{ matrix.buildSystem }}"
    - name: "Set Release Name"
      run: "repo='${{ matrix.repositoryName }}'; echo \"RELEASE_NAME=${repo/\\//--}--${{ matrix.platform }}--${{ matrix.commitSHA }}\" >> \"$GITHUB_ENV\""
    - name: "Set Repository Owner"
      run: "echo \"REPOSITORY_OWNER=${REPOSITORY_NAME%%/*}\" >> \"$GITHUB_ENV\""
      env:
        REPOSITORY_NAME: "${{ matrix.repositoryName }}"
    - name: "Create Repository Token"
      id: "create-repository-token"
      uses: "actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510"
      with:
        client-id: "${{ vars[env.CLIENT_ID_VARIABLE] }}"
        private-key: "${{ secrets[env.PRIVATE_KEY_SECRET] }}"
        owner: "${{ env.REPOSITORY_OWNER }}"
        repositories: "${{ matrix.repositoryName }}"
        permission-contents: "write"
    - name: "Find Release Artifact"
      id: "find-release-artifact"
      uses: "$/.github/actions/find-release-artifact"
      with:
        repository-name: "${{ matrix.repositoryName }}"
        release-name: "${{ env.RELEASE_NAME }}"
        github-token: "${{ steps.create-repository-token.outputs.token }}"
    - name: "Check Out ${{ matrix.repositoryName }}"
      if: "steps.find-release-artifact.outputs.found != 'true'"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      with:
        repository: "${{ matrix.repositoryName }}"
        ref: "${{ matrix.commitSHA }}"
        persist-credentials: "false"
        token: "${{ steps.create-repository-token.outputs.token }}"
    - name: "Build ${{ matrix.repositoryName }}"
      if: "steps.find-release-artifact.outputs.found != 'true' && matrix.buildSystem == 'universal'"
      uses: "$/.github/actions/universal-build"
    - name: "Publish Release Artifact"
      if: "steps.find-release-artifact.outputs.found != 'true'"
      uses: "$/.github/actions/publish-release-artifact"
      with:
        repository-name: "${{ matrix.repositoryName }}"
        commit-sha: "${{ matrix.commitSHA }}"
        release-name: "${{ env.RELEASE_NAME }}"
        github-token: "${{ steps.create-repository-token.outputs.token }}"
  step_2:
    name: "Continuous Integration - Packaging ${{ matrix.repositoryName }} (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
        - repositoryName: "nader-najjar/pure-java"
          commitSHA: "6f0e53a80486a7bca8caf647afe0087f8f34e299"
          platform: "aarch64-linux"
          runner: "ubuntu-24.04-arm"
    runs-on: "${{ matrix.runner }}"
    env:
      CLIENT_ID_VARIABLE: "PURE_APP_CLIENT_ID"
      PRIVATE_KEY_SECRET: "PURE_APP_PRIVATE_KEY"
      GHCR_USERNAME: "nader-najjar"
      GHCR_PAT_SECRET: "PURE_PACKAGING_PAT"
    steps:
    - name: "Reject Manual Retries"
      uses: "$/.github/actions/reject-manual-retries"
    - name: "Set Release Name"
      run: |
        repo='${{ matrix.repositoryName }}'
        echo "RELEASE_NAME=${repo/\//--}--${{ matrix.platform }}--${{ matrix.commitSHA }}" >> "$GITHUB_ENV"
    - name: "Set Repository Owner"
      run: |
        repo='${{ matrix.repositoryName }}'
        echo "REPOSITORY_OWNER=${repo%%/*}" >> "$GITHUB_ENV"
    - name: "Create Repository Token"
      id: "create-repository-token"
      uses: "actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510"
      with:
        client-id: "${{ vars[env.CLIENT_ID_VARIABLE] }}"
        private-key: "${{ secrets[env.PRIVATE_KEY_SECRET] }}"
        owner: "${{ env.REPOSITORY_OWNER }}"
        repositories: "${{ matrix.repositoryName }}"
        permission-contents: "read"
    - name: "Download and Extract Release"
      shell: "bash"
      env:
        GH_TOKEN: "${{ steps.create-repository-token.outputs.token }}"
      run: |
        gh release download "$RELEASE_NAME" \
          --repo "${{ matrix.repositoryName }}" \
          --pattern "$RELEASE_NAME.tar.gz" \
          --dir "$RUNNER_TEMP"
        mkdir -p "$RUNNER_TEMP/oci-package"
        tar -xzf "$RUNNER_TEMP/$RELEASE_NAME.tar.gz" -C "$RUNNER_TEMP/oci-package"
    - name: "Set Up Docker"
      uses: "docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6"
      with:
        version: "v29.10.0"
    - name: "Set Up Buildx"
      uses: "docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069"
      with:
        version: "v0.39.0"
        driver: "docker"
    - name: "Log In to GHCR"
      shell: "bash"
      env:
        GHCR_TOKEN: "${{ secrets[env.GHCR_PAT_SECRET] }}"
      run: "printf '%s' \"$GHCR_TOKEN\" | docker login ghcr.io --username \"$GHCR_USERNAME\" --password-stdin"
    - name: "Build and Push Image"
      shell: "bash"
      run: |
        repo='${{ matrix.repositoryName }}'
        image="ghcr.io/${repo,,}:$RELEASE_NAME"
        docker buildx build "$RUNNER_TEMP/oci-package" \
          --tag "$image" \
          --label "org.opencontainers.image.source=https://github.com/$repo" \
          --annotation "index:org.opencontainers.image.source=https://github.com/$repo" \
          --push
    needs: "step_1"
