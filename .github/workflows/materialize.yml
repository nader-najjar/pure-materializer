name: "Materialize"
run-name: "Materialize"
"on":
  push:
    branches:
    - "execution"
concurrency:
  group: "materialize"
  queue: "single"
  cancel-in-progress: false
permissions:
  contents: "read"
jobs:
  step_1:
    name: "Build ${{ matrix.repositoryName }} (${{ matrix.platform }})"
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        include:
        - repositoryName: "nader-najjar/pure-java"
          commitSHA: "b303c02512ecf9b27f6a2c71e6d88ba1c3b83cdb"
          buildSystem: "universal"
          platform: "aarch64-linux"
          runner: "ubuntu-24.04-arm"
        - repositoryName: "nader-najjar/pure-java-lambda"
          commitSHA: "9ace4a75c8dedd5db826163979c6b603c38c7427"
          buildSystem: "universal"
          platform: "aarch64-linux"
          runner: "ubuntu-24.04-arm"
        - repositoryName: "nader-najjar/pure-javascript"
          commitSHA: "02a660646b7c7abe77d022066ef7cdf884317782"
          buildSystem: "universal"
          platform: "aarch64-linux"
          runner: "ubuntu-24.04-arm"
        - repositoryName: "nader-najjar/pure-javascript-react"
          commitSHA: "d48fd2d317b5df41041db20104c3fb6f12e02217"
          buildSystem: "universal"
          platform: "aarch64-linux"
          runner: "ubuntu-24.04-arm"
        - repositoryName: "nader-najjar/pure-schematic"
          commitSHA: "35e0dc65c8804d75d32500d15b832bd7049b8720"
          buildSystem: "universal"
          platform: "aarch64-linux"
          runner: "ubuntu-24.04-arm"
    steps:
    - name: "Reject Manual Retries"
      uses: "$/.github/actions/reject-manual-retries"
    - name: "Reject Unsupported Build Systems"
      if: "matrix.buildSystem != 'universal'"
      run: |
        echo "::error::Unsupported build system: $BUILD_SYSTEM"
        exit 1
      env:
        BUILD_SYSTEM: "${{ matrix.buildSystem }}"
    - name: "Check Out ${{ matrix.repositoryName }}"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      with:
        ref: "${{ matrix.commitSHA }}"
        repository: "${{ matrix.repositoryName }}"
        persist-credentials: "false"
    - name: "Build ${{ matrix.repositoryName }}"
      if: "matrix.buildSystem == 'universal'"
      uses: "$/.github/actions/universal-build"
    - name: "Set Artifact Repository Name"
      run: "echo \"ARTIFACT_REPOSITORY=${REPOSITORY_NAME/\\//@}\" >> \"$GITHUB_ENV\""
      env:
        REPOSITORY_NAME: "${{ matrix.repositoryName }}"
    - name: "Upload Release Artifact"
      uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
      with:
        if-no-files-found: "error"
        name: "${{ env.ARTIFACT_REPOSITORY }}-${{ matrix.platform }}-${{ matrix.commitSHA }}"
        path: "build/release-artifact.tar.gz"
